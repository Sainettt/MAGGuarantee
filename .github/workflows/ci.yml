name: CI

# Push и PR только ПРОВЕРЯЮТ код — ничего никуда не выкатывается.
# Деплой — отдельный workflow Deploy (deploy.yml): Actions → Deploy → Run workflow.
# Он вызывает этот workflow как гейт (workflow_call) перед сборкой образов.
#
# Так сделано после инцидента 2026-07-28: раньше `deploy-staging` срабатывала на
# каждый push в main и накатывала staging-компоуз (с mailhog и проброшенными
# портами) поверх стека, который к тому моменту уже был поднят прод-компоузом.
# Автодеплой хорош, пока сервер один и назначение у него одно.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magguarantee-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: magguarantee-app/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # DATABASE_URL здесь намеренно НЕ задаётся: apps/api/test/check-constraints.spec.ts
      # сам скипается без него, и джоба остаётся чисто юнит-тестовой.
      - run: npm test

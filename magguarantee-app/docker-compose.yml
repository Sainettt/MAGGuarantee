services:
  postgres:
    image: postgres:16-alpine
    container_name: magguarantee-postgres
    environment:
      POSTGRES_USER: magguarantee
      POSTGRES_PASSWORD: sainet123
      POSTGRES_DB: magguarantee
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magguarantee"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: magguarantee-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: magguarantee-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # S3-compatible object storage for dev — file uploads (vehicle umowa /
  # cabotage screenshots, claim auth screenshots). Prod uses a real
  # S3-compatible provider (Cloudflare R2 / Hetzner Object Storage).
  minio:
    image: minio/minio:latest
    container_name: magguarantee-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      # Must match apps/api/.env S3_SECRET_KEY — MinIO bakes these root creds
      # into its data volume on FIRST init, so if they diverge and the volume
      # is ever recreated, the API's uploads start failing auth.
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot helper: waits for MinIO, then creates the `magguarantee` bucket
  # if it does not exist. Exits 0 once done — `docker compose up` treats a
  # cleanly-exited one-shot as completed, not failed.
  minio-init:
    image: minio/mc:latest
    container_name: magguarantee-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/magguarantee &&
      echo 'MinIO bucket magguarantee ready';
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:

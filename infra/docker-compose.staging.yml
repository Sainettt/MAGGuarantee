# MAGGuarantee — staging stack.
#
# Build context for api/web is `../magguarantee-app` (relative to this file).
# Env source of truth is `infra/.env` (gitignored). Compose auto-loads it
# both for `${...}` interpolation in this file AND for the per-service
# `env_file:` directives below — single file, no --env-file flag, no
# parent-dir tricks.
#
# Deploy on the VPS:
#
#   cd /opt/magguarantee/src
#   git pull
#   docker compose -f infra/docker-compose.staging.yml up -d --build
#
# Locally (smoke test):
#
#   cd MAGGuarantee
#   docker compose -f infra/docker-compose.staging.yml up -d --build
#
# Required pre-step (one-time, both VPS and local):
#   docker network create proxy-net

services:
  postgres:
    image: postgres:16-alpine
    container_name: magguarantee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: magguarantee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: magguarantee
    volumes:
      - ${POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql/data
    # Bind to loopback only — Postgres is reachable from the VPS host via
    # 127.0.0.1:5432, but NOT from the public internet (ufw blocks 5432).
    # GUI clients (DBeaver, databasus, psql) connect through an SSH tunnel.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U magguarantee']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: magguarantee-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - ${REDIS_DATA:-./data/redis}:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  # Mailhog catches all outgoing email. Web UI bound to 127.0.0.1 only — on
  # the VPS reach it via SSH tunnel:  ssh -L 8025:localhost:8025 magguarantee-staging
  mailhog:
    image: mailhog/mailhog:latest
    container_name: magguarantee-mailhog
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

  # S3-compatible object storage — vehicle umowa / cabotage screenshot
  # uploads (VehicleAttachment). For real production this can be swapped for
  # a managed provider (Cloudflare R2 / Hetzner) by repointing the S3_* env
  # vars and dropping this service + minio-init.
  minio:
    image: minio/minio:latest
    container_name: magguarantee-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY required in .env}
    volumes:
      - ${MINIO_DATA:-./data/minio}:/data
    # Loopback-only — the API reaches MinIO over the `internal` network; the
    # host ports are just for SSH-tunnel admin (console on 9001).
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  # One-shot: waits for MinIO, creates the `magguarantee` bucket if missing,
  # then exits 0. `api` waits for this so uploads never hit a missing bucket.
  minio-init:
    image: minio/mc:latest
    container_name: magguarantee-minio-init
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/magguarantee &&
      echo 'MinIO bucket magguarantee ready';
      "
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

  api:
    build:
      context: ../magguarantee-app
      dockerfile: apps/api/Dockerfile
    container_name: magguarantee-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    # Loopback-only exposure: convenient for local smoke tests and SSH-tunnel
    # debugging on the VPS, but invisible to the public internet there
    # (Caddy reaches api via the proxy-net Docker network, not via host).
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - internal
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'

  web:
    build:
      context: ../magguarantee-app
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle. Must match the URL the browser
        # uses to reach the API (NOT the in-cluster docker hostname).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required in .env}
    container_name: magguarantee-web
    restart: unless-stopped
    env_file: .env
    # `env_file` is shared with api and sets PORT=3001 (api's port). For web
    # we override it back to 3000 because `environment:` has higher priority
    # than `env_file:` in compose.
    environment:
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

networks:
  internal:
    driver: bridge
  proxy-net:
    external: true

# MAGGuarantee — staging stack.
#
# Build context for api/web is `../magguarantee-app` (relative to this file).
# Env source of truth is `infra/.env` (gitignored). Compose auto-loads it
# both for `${...}` interpolation in this file AND for the per-service
# `env_file:` directives below — single file, no --env-file flag, no
# parent-dir tricks.
#
# Deploy on the VPS:
#
#   cd /opt/magguarantee/src
#   git pull
#   docker compose -f infra/docker-compose.staging.yml up -d --build
#
# Locally (smoke test):
#
#   cd MAGGuarantee
#   docker compose -f infra/docker-compose.staging.yml up -d --build
#
# Required pre-step (one-time, both VPS and local):
#   docker network create proxy-net
#
# POSTGRES_DATA / REDIS_DATA / MINIO_DATA have NO defaults — compose refuses to
# start until .env sets them. VPS: absolute /opt/magguarantee/data/*. Local
# smoke test: any explicit path, e.g. ./data/postgres (resolves to infra/data/,
# gitignored) — a conscious choice rather than a silent fallback.

services:
  postgres:
    image: postgres:16-alpine
    container_name: magguarantee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: magguarantee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: magguarantee
    volumes:
      # No default on purpose (all three data paths): a silent `./data/...`
      # fallback put live data inside the git checkout, where the backup job
      # does not look and `git clean -xfd` deletes it. Set it in .env — see
      # .env.staging.example.
      - ${POSTGRES_DATA:?POSTGRES_DATA required in .env — use an absolute path}:/var/lib/postgresql/data
    # Bind to loopback only — Postgres is reachable from the VPS host via
    # 127.0.0.1:5432, but NOT from the public internet (ufw blocks 5432).
    # GUI clients (DBeaver, databasus, psql) connect through an SSH tunnel.
    ports:
      - '127.0.0.1:5432:5432'
    # Same logging flags as prod — see the note in docker-compose.prod.yml
    # (connections for direct-DB forensics; slow statements WITHOUT parameter
    # values, which would otherwise leak NIPs / emails / hashes into the log).
    command: >
      postgres
      -c log_connections=on
      -c log_disconnections=on
      -c log_min_duration_statement=1000
      -c log_parameter_max_length=0
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U magguarantee']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
        compress: 'true'

  redis:
    image: redis:7-alpine
    container_name: magguarantee-redis
    restart: unless-stopped
    # `noeviction` is REQUIRED by BullMQ — an LRU policy silently deletes queue
    # keys under memory pressure (lost jobs, stalled workers). With noeviction a
    # full Redis fails writes loudly instead. See docker-compose.prod.yml.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - ${REDIS_DATA:?REDIS_DATA required in .env — use an absolute path}:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'
        compress: 'true'

  # Mailhog catches all outgoing email. Web UI bound to 127.0.0.1 only — on
  # the VPS reach it via SSH tunnel:  ssh -L 8025:localhost:8025 magguarantee-staging
  mailhog:
    image: mailhog/mailhog:latest
    container_name: magguarantee-mailhog
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'
        compress: 'true'

  # S3-compatible object storage — vehicle umowa / cabotage screenshot
  # uploads (VehicleAttachment). For real production this can be swapped for
  # a managed provider (Cloudflare R2 / Hetzner) by repointing the S3_* env
  # vars and dropping this service + minio-init.
  minio:
    image: minio/minio:latest
    container_name: magguarantee-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY required in .env}
    volumes:
      - ${MINIO_DATA:?MINIO_DATA required in .env — use an absolute path}:/data
    # Loopback-only — the API reaches MinIO over the `internal` network; the
    # host ports are just for SSH-tunnel admin (console on 9001).
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'
        compress: 'true'

  # One-shot: waits for MinIO, creates the `magguarantee` bucket if missing,
  # then exits 0. `api` waits for this so uploads never hit a missing bucket.
  minio-init:
    image: minio/mc:latest
    container_name: magguarantee-minio-init
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/magguarantee &&
      echo 'MinIO bucket magguarantee ready';
      "
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
        compress: 'true'

  api:
    build:
      context: ../magguarantee-app
      dockerfile: apps/api/Dockerfile
    container_name: magguarantee-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    # Loopback-only exposure: convenient for local smoke tests and SSH-tunnel
    # debugging on the VPS, but invisible to the public internet there
    # (Caddy reaches api via the proxy-net Docker network, not via host).
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - internal
      - proxy-net
      # Google SSO — the MAGSpace employee directory (docs/24 §A6).
      - magtrans-internal
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'
        compress: 'true'

  web:
    build:
      context: ../magguarantee-app
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle. Must match the URL the browser
        # uses to reach the API (NOT the in-cluster docker hostname).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required in .env}
        # Past-departure bypass for the carrier "nowy wyjazd" form (UAT only:
        # lets the demo build a backdated flow instead of waiting real days).
        # Defaults to `false` so an .env without the key keeps prod semantics.
        # Must be kept in sync with the api-side `ALLOW_PAST_DEPARTURE` — the
        # two flags are independent, and only the api one is authoritative.
        NEXT_PUBLIC_ALLOW_PAST_DEPARTURE: ${NEXT_PUBLIC_ALLOW_PAST_DEPARTURE:-false}
        # Google sign-in client id (docs/24 §A6). Baked into the CLIENT bundle at
        # BUILD time — changing it in .env requires `docker compose build web`,
        # a restart keeps the stale value. Empty = the Google button is not
        # rendered at all and only the password form is shown.
        NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID:-}
    container_name: magguarantee-web
    restart: unless-stopped
    env_file: .env
    # `env_file` is shared with api and sets PORT=3001 (api's port). For web
    # we override it back to 3000 because `environment:` has higher priority
    # than `env_file:` in compose.
    environment:
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
        compress: 'true'

networks:
  internal:
    driver: bridge
  proxy-net:
    external: true
  # Shared with the MAGSpace stack — this is how `magguarantee-api` reaches the
  # employee directory at `http://magspace-api:3001/internal/v1` (docs/24 §A6).
  # Deliberately NOT `proxy-net`: that one exists for Caddy, and the directory
  # API is never published. Created once per VPS, by hand:
  #   docker network create magtrans-internal
  # MAGSpace joins it from its own staging overlay.
  magtrans-internal:
    name: ${INTERNAL_NETWORK:-magtrans-internal}
    external: true
